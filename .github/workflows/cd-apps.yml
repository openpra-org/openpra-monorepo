name: "CD: Deploy Web App (apps/)"

on:
  workflow_dispatch:
  push:
    branches:
      - revamp

permissions:
  contents: read

env:
  REGISTRY: registry.openpra.org

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"

      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install dependencies
        run: npx -y pnpm@10.19.0 install --ignore-scripts --no-frozen-lockfile

      - name: Build apps
        env:
          NX_NO_CLOUD: "true"
        run: |
          npx -y pnpm@10.19.0 nx build backends-web-backend --configuration=production
          npx -y pnpm@10.19.0 nx build frontends-web-frontend --configuration=production

      - name: Install doc generation tools
        run: |
          sudo apt-get install -y doxygen
          pip install pdoc plotly

      - name: Install docs dependencies
        run: cd docs && npx -y pnpm@10.19.0 install --no-frozen-lockfile

      - name: Generate TypeScript API docs (TypeDoc)
        run: |
          cd docs
          npx -y pnpm@10.19.0 run generate:ts:mef-types
          npx -y pnpm@10.19.0 run generate:ts:shared-types
          npx -y pnpm@10.19.0 run generate:ts:web-backend
          npx -y pnpm@10.19.0 run generate:ts:web-frontend
          npx -y pnpm@10.19.0 run generate:ts:praetor

      - name: Generate C++ API docs (SCRAM — Doxygen HTML)
        run: |
          mkdir -p docs/public/api/cpp/scram
          doxygen docs/tools/Doxyfile

      - name: Generate Rust API docs (PRAXIS — cargo doc)
        run: |
          mkdir -p docs/public/api/rust/praxis
          cd apps/solvers/praxis
          cargo doc --no-deps --target-dir ../../../docs/.tmp/praxis-cargo-doc 2>&1 || echo "cargo doc encountered warnings"
          cp -r ../../../docs/.tmp/praxis-cargo-doc/doc/. ../../../docs/public/api/rust/praxis/

      - name: Generate Python API docs (pdoc)
        run: |
          mkdir -p docs/public/api/python/pracciolini docs/public/api/python/saphsolve
          (cd apps/utilities/pracciolini/src && \
            PYTHONPATH=. pdoc --output-directory ../../../../docs/public/api/python/pracciolini \
              convert ftap ftap_verifier jsinp jsinp_verifier model \
              openpsa_verifier openpsa_xml parse_ftrex_log parse_praxis_log \
              parse_saphsolve_log parse_scram_log parse_xfta_log parse_zebra_log \
              plot_benchmark_results s2ml s2ml_verifier 2>&1) \
          || echo "Pracciolini pdoc: see above"
          pdoc --output-directory docs/public/api/python/saphsolve apps/solvers/saphsolve 2>&1 || echo "SAPHSOLVE pdoc: see above"

      - name: Build docs site
        run: |
          mkdir -p docs/public
          cp apps/frontends/web-frontend/src/assets/OpenPRA.png docs/public/openpra-logo.png
          cd docs && npx -y pnpm@10.19.0 run build

      - name: Prepare tags
        id: prep
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare backend build context
        run: |
          mkdir -p docker-context/web-backend
          cp dist/apps/backends/web-backend/main.js docker-context/web-backend/main.js
          cp apps/backends/web-backend/package.json docker-context/web-backend/package.json
          node -e '
            const fs = require("fs");
            const path = "docker-context/web-backend/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const key of ["dependencies", "devDependencies"]) {
              if (!pkg[key]) continue;
              for (const [name, version] of Object.entries({ ...pkg[key] })) {
                if (typeof version === "string" && version.startsWith("workspace:")) delete pkg[key][name];
              }
            }
            delete pkg.devDependencies;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          '
          cp deploy/web/backend.Dockerfile docker-context/web-backend/Dockerfile

      - name: Prepare frontend build context
        run: |
          mkdir -p docker-context/web-frontend/html
          cp -r dist/apps/frontends/web-frontend/* docker-context/web-frontend/html/
          cp deploy/web/nginx.conf docker-context/web-frontend/nginx.conf
          cp deploy/web/frontend.Dockerfile docker-context/web-frontend/Dockerfile

      - name: Prepare docs build context
        run: |
          mkdir -p docker-context/docs/html
          cp -r docs/.vitepress/dist/* docker-context/docs/html/
          cp deploy/web/docs-nginx.conf docker-context/docs/docs-nginx.conf
          cp deploy/web/docs.Dockerfile docker-context/docs/Dockerfile

      - name: Log in to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Save base images for offline load
        run: |
          docker pull mongo:latest
          docker pull minio/minio:latest
          docker save mongo:latest minio/minio:latest -o base-images.tar

      - name: Upload base images artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-images
          path: base-images.tar
          retention-days: 1

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/web-backend
          file: docker-context/web-backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.prep.outputs.branch_slug }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/web-frontend
          file: docker-context/web-frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.prep.outputs.branch_slug }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/docs
          file: docker-context/docs/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-docs:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-docs:${{ steps.prep.outputs.branch_slug }}

  deploy:
    needs: build-and-push
    runs-on: gaia1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment vars
        id: vars
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "host_url=${BRANCH_SLUG}-dev.openpra.org" >> "$GITHUB_OUTPUT"

      - name: Log in to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Download base images artifact
        uses: actions/download-artifact@v4
        with:
          name: base-images
          path: .

      - name: Load base images into the swarm node
        run: docker load -i base-images.tar

      - name: Deploy to Docker Swarm
        env:
          APP_NAME: openpra-apps-${{ steps.vars.outputs.branch_slug }}
          HOST_URL: ${{ steps.vars.outputs.host_url }}
          IMAGE_BACKEND: ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.vars.outputs.short_sha }}
          IMAGE_FRONTEND: ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.vars.outputs.short_sha }}
          IMAGE_DOCS: ${{ env.REGISTRY }}/openpra-apps-docs:${{ steps.vars.outputs.short_sha }}
          IMAGE_MONGO: mongo:latest
          IMAGE_MINIO: minio/minio:latest
          JWT_SECRET: ${{ secrets.APPS_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.APPS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.APPS_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.APPS_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APPS_GH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.APPS_RESEND_API_KEY }}
          TFA_ENC_KEY: ${{ secrets.APPS_TFA_ENC_KEY }}
        run: |
          docker stack deploy \
            --with-registry-auth \
            --resolve-image never \
            --compose-file deploy/web/cd-stack.yml \
            "openpra-apps-${{ steps.vars.outputs.branch_slug }}"
          echo "Deployed openpra-apps-${{ steps.vars.outputs.branch_slug }} to https://${{ steps.vars.outputs.host_url }}"

      - name: Roll base-image services onto the loaded images
        run: |
          SLUG="${{ steps.vars.outputs.branch_slug }}"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_mongodb"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_minio"

      - name: Check deployment status
        run: |
          sleep 30
          docker service ls --filter "label=com.docker.stack.namespace=openpra-apps-${{ steps.vars.outputs.branch_slug }}"
