name: "CD: Deploy Web App + Site (apps/)"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: registry.openpra.org
  MINIO_SOURCE_IMAGE: quay.io/minio/minio:latest

jobs:
  images:
    uses: ./.github/workflows/images.yml
    with:
      push: true
      deploy: true
    secrets: inherit

  deploy:
    needs: images
    runs-on: gaia1
    env:
      MONGO_IMAGE: ${{ needs.images.outputs.mongo_image }}
      MINIO_IMAGE: ${{ needs.images.outputs.minio_image }}
      PRAETOR_IMAGE: ${{ needs.images.outputs.praetor_image }}
      RABBITMQ_IMAGE: ${{ needs.images.outputs.rabbitmq_image }}
      DOCS_HASH: ${{ needs.images.outputs.docs_hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment vars
        id: vars
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "host_url=${BRANCH_SLUG}-dev.openpra.org" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH_SLUG" = "main" ]; then
            echo "site_host_url=openpra.org" >> "$GITHUB_OUTPUT"
            echo "site_stack=openpra-site" >> "$GITHUB_OUTPUT"
          else
            echo "site_host_url=${BRANCH_SLUG}-site-dev.openpra.org" >> "$GITHUB_OUTPUT"
            echo "site_stack=openpra-site-${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Check MongoDB image present
        id: basecheck
        run: |
          if docker image inspect "$MONGO_IMAGE" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download base images artifact
        if: steps.basecheck.outputs.have == 'false'
        uses: actions/download-artifact@v4
        with:
          name: base-images
          path: .

      - name: Load base images into the swarm node
        if: steps.basecheck.outputs.have == 'false'
        run: docker load -i base-images.tar

      - name: Report MongoDB version on this node
        run: docker image inspect "$MONGO_IMAGE" --format '{{.Id}} {{range .Config.Env}}{{.}} {{end}}'

      - name: Check PRAETOR images present
        id: praetorcheck
        run: |
          if docker image inspect "$PRAETOR_IMAGE" >/dev/null 2>&1 && docker image inspect "$RABBITMQ_IMAGE" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PRAETOR images artifact
        if: steps.praetorcheck.outputs.have == 'false'
        uses: actions/download-artifact@v4
        with:
          name: praetor-images
          path: .

      - name: Load PRAETOR images into the swarm node
        if: steps.praetorcheck.outputs.have == 'false'
        run: docker load -i praetor-images.tar

      - name: Provide pinned MinIO image
        run: |
          if docker pull "$MINIO_IMAGE" >/dev/null 2>&1; then
            echo "Using $MINIO_IMAGE from the registry"
          elif docker image inspect "$MINIO_SOURCE_IMAGE" >/dev/null 2>&1; then
            docker tag "$MINIO_SOURCE_IMAGE" "$MINIO_IMAGE"
            docker push "$MINIO_IMAGE"
            echo "Mirrored $MINIO_SOURCE_IMAGE from this node to $MINIO_IMAGE"
          else
            echo "::error::$MINIO_IMAGE is missing from the registry and $MINIO_SOURCE_IMAGE is missing from this node"
            exit 1
          fi
          docker image inspect "$MINIO_IMAGE" --format "MinIO image {{.Id}}"

      - name: Check documents image present
        id: docscheck
        run: |
          if docker image inspect "openpra-apps-web-backend-docs:$DOCS_HASH" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download documents image artifact
        if: steps.docscheck.outputs.have == 'false'
        uses: actions/download-artifact@v4
        with:
          name: backend-docs-image
          path: .

      - name: Load documents image into the swarm node
        if: steps.docscheck.outputs.have == 'false'
        run: docker load -i backend-docs-image.tar

      - name: Populate documents volume
        run: |
          VOL="openpra-docs-$DOCS_HASH"
          docker volume create "$VOL" >/dev/null
          docker run --rm -v "$VOL":/dest "openpra-apps-web-backend-docs:$DOCS_HASH" \
            sh -c 'if [ ! -f /dest/.populated ]; then tar -C /example-documents -cf - . | tar -C /dest -xf - && touch /dest/.populated; fi'

      - name: Deploy to Docker Swarm
        env:
          APP_NAME: openpra-apps-${{ steps.vars.outputs.branch_slug }}
          HOST_URL: ${{ steps.vars.outputs.host_url }}
          IMAGE_BACKEND: ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.vars.outputs.short_sha }}
          IMAGE_FRONTEND: ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.vars.outputs.short_sha }}
          IMAGE_MONGO: ${{ env.MONGO_IMAGE }}
          IMAGE_MINIO: ${{ env.MINIO_IMAGE }}
          IMAGE_PRAETOR: ${{ env.PRAETOR_IMAGE }}
          IMAGE_RABBITMQ: ${{ env.RABBITMQ_IMAGE }}
          MONGO_DATABASE: openpra_main_20260821t001435z
          MINIO_BUCKET: openpra-main-20260821t001435z
          JWT_SECRET: ${{ secrets.APPS_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.APPS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.APPS_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.APPS_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APPS_GH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.APPS_RESEND_API_KEY }}
          TFA_ENC_KEY: ${{ secrets.APPS_TFA_ENC_KEY }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.APPS_ADMIN_BOOTSTRAP_EMAILS }}
        run: |
          docker stack deploy \
            --with-registry-auth \
            --resolve-image never \
            --compose-file deploy/web/cd-stack.yml \
            "openpra-apps-${{ steps.vars.outputs.branch_slug }}"
          echo "Deployed openpra-apps-${{ steps.vars.outputs.branch_slug }} to https://${{ steps.vars.outputs.host_url }}"

      - name: Deploy site to Docker Swarm
        env:
          APP_NAME: ${{ steps.vars.outputs.site_stack }}
          IMAGE_SITE: ${{ env.REGISTRY }}/openpra-apps-site:${{ steps.vars.outputs.short_sha }}
          SITE_HOST_URL: ${{ steps.vars.outputs.site_host_url }}
        run: |
          docker stack deploy \
            --with-registry-auth \
            --resolve-image never \
            --compose-file deploy/site/cd-stack.yml \
            "${{ steps.vars.outputs.site_stack }}"
          echo "Deployed ${{ steps.vars.outputs.site_stack }} to https://${SITE_HOST_URL}"

      - name: Roll base-image services onto the loaded images
        run: |
          SLUG="${{ steps.vars.outputs.branch_slug }}"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_mongodb"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_minio"

      - name: Check deployment status
        run: |
          sleep 30
          docker service ls --filter "label=com.docker.stack.namespace=openpra-apps-${{ steps.vars.outputs.branch_slug }}"
          docker service ls --filter "label=com.docker.stack.namespace=${{ steps.vars.outputs.site_stack }}"
