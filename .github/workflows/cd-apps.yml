name: "CD: Deploy Web App + Site (apps/)"

on:
  workflow_dispatch:
  push:
    branches:
      - revamp

permissions:
  contents: read

env:
  REGISTRY: registry.openpra.org

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      docs_hash: ${{ steps.docs.outputs.docs_hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"

      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install dependencies
        run: npx -y pnpm@10.19.0 install --ignore-scripts --no-frozen-lockfile

      - name: Build apps
        env:
          NX_NO_CLOUD: "true"
        run: |
          npx -y pnpm@10.19.0 nx build backends-web-backend --configuration=production
          npx -y pnpm@10.19.0 nx build frontends-web-frontend --configuration=production
          npx -y pnpm@10.19.0 nx build site

      - name: Prepare tags
        id: prep
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare backend build context
        run: |
          mkdir -p docker-context/web-backend
          cp dist/apps/backends/web-backend/main.js docker-context/web-backend/main.js
          cp apps/backends/web-backend/package.json docker-context/web-backend/package.json
          node -e '
            const fs = require("fs");
            const path = "docker-context/web-backend/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const key of ["dependencies", "devDependencies"]) {
              if (!pkg[key]) continue;
              for (const [name, version] of Object.entries({ ...pkg[key] })) {
                if (typeof version === "string" && version.startsWith("workspace:")) delete pkg[key][name];
              }
            }
            delete pkg.devDependencies;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          '
          cp deploy/web/backend.Dockerfile docker-context/web-backend/Dockerfile

      - name: Build and save documents image
        id: docs
        run: |
          DOCS_SRC=dist/apps/backends/web-backend/example-documents
          DOCS_HASH=$(find "$DOCS_SRC" -type f -exec sha256sum {} \; | sort | sha256sum | cut -c1-16)
          echo "docs_hash=$DOCS_HASH" >> "$GITHUB_OUTPUT"
          mkdir -p docker-context/web-backend-docs
          cp -r "$DOCS_SRC" docker-context/web-backend-docs/example-documents
          cp deploy/web/backend-docs.Dockerfile docker-context/web-backend-docs/Dockerfile
          docker build -t "openpra-apps-web-backend-docs:$DOCS_HASH" docker-context/web-backend-docs
          docker save "openpra-apps-web-backend-docs:$DOCS_HASH" -o backend-docs-image.tar

      - name: Upload documents image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docs-image
          path: backend-docs-image.tar
          retention-days: 1

      - name: Prepare frontend build context
        run: |
          mkdir -p docker-context/web-frontend/html
          cp -r dist/apps/frontends/web-frontend/* docker-context/web-frontend/html/
          cp deploy/web/nginx.conf docker-context/web-frontend/nginx.conf
          cp deploy/web/frontend.Dockerfile docker-context/web-frontend/Dockerfile

      - name: Prepare site build context
        run: |
          mkdir -p docker-context/site/html
          cp -r apps/site/dist/. docker-context/site/html/
          cp deploy/site/nginx.conf docker-context/site/nginx.conf
          cp deploy/site/Dockerfile docker-context/site/Dockerfile

      - name: Log in to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Save base images for offline load
        run: |
          docker pull mongo:latest
          docker pull minio/minio:latest
          docker save mongo:latest minio/minio:latest -o base-images.tar

      - name: Upload base images artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-images
          path: base-images.tar
          retention-days: 1

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/web-backend
          file: docker-context/web-backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.prep.outputs.branch_slug }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/web-frontend
          file: docker-context/web-frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.prep.outputs.branch_slug }}

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/site
          file: docker-context/site/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/openpra-apps-site:${{ steps.prep.outputs.short_sha }}
            ${{ env.REGISTRY }}/openpra-apps-site:${{ steps.prep.outputs.branch_slug }}

  deploy:
    needs: build-and-push
    runs-on: gaia1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment vars
        id: vars
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "host_url=${BRANCH_SLUG}-dev.openpra.org" >> "$GITHUB_OUTPUT"
          echo "site_host_url=openpra.org" >> "$GITHUB_OUTPUT"

      - name: Log in to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Check base images present
        id: basecheck
        run: |
          if docker image inspect mongo:latest >/dev/null 2>&1 && docker image inspect minio/minio:latest >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download base images artifact
        if: steps.basecheck.outputs.have == 'false'
        uses: actions/download-artifact@v4
        with:
          name: base-images
          path: .

      - name: Load base images into the swarm node
        if: steps.basecheck.outputs.have == 'false'
        run: docker load -i base-images.tar

      - name: Check documents image present
        id: docscheck
        run: |
          HASH="${{ needs.build-and-push.outputs.docs_hash }}"
          if docker image inspect "openpra-apps-web-backend-docs:$HASH" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download documents image artifact
        if: steps.docscheck.outputs.have == 'false'
        uses: actions/download-artifact@v4
        with:
          name: backend-docs-image
          path: .

      - name: Load documents image into the swarm node
        if: steps.docscheck.outputs.have == 'false'
        run: docker load -i backend-docs-image.tar

      - name: Populate documents volume
        run: |
          HASH="${{ needs.build-and-push.outputs.docs_hash }}"
          VOL="openpra-docs-$HASH"
          docker volume create "$VOL" >/dev/null
          docker run --rm -v "$VOL":/dest "openpra-apps-web-backend-docs:$HASH" \
            sh -c 'if [ ! -f /dest/.populated ]; then tar -C /example-documents -cf - . | tar -C /dest -xf - && touch /dest/.populated; fi'

      - name: Deploy to Docker Swarm
        env:
          APP_NAME: openpra-apps-${{ steps.vars.outputs.branch_slug }}
          HOST_URL: ${{ steps.vars.outputs.host_url }}
          IMAGE_BACKEND: ${{ env.REGISTRY }}/openpra-apps-web-backend:${{ steps.vars.outputs.short_sha }}
          IMAGE_FRONTEND: ${{ env.REGISTRY }}/openpra-apps-web-frontend:${{ steps.vars.outputs.short_sha }}
          IMAGE_MONGO: mongo:latest
          IMAGE_MINIO: minio/minio:latest
          DOCS_HASH: ${{ needs.build-and-push.outputs.docs_hash }}
          JWT_SECRET: ${{ secrets.APPS_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.APPS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.APPS_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.APPS_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APPS_GH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.APPS_RESEND_API_KEY }}
          TFA_ENC_KEY: ${{ secrets.APPS_TFA_ENC_KEY }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.APPS_ADMIN_BOOTSTRAP_EMAILS }}
        run: |
          docker stack deploy \
            --with-registry-auth \
            --resolve-image never \
            --compose-file deploy/web/cd-stack.yml \
            "openpra-apps-${{ steps.vars.outputs.branch_slug }}"
          echo "Deployed openpra-apps-${{ steps.vars.outputs.branch_slug }} to https://${{ steps.vars.outputs.host_url }}"

      - name: Deploy site to Docker Swarm
        env:
          IMAGE_SITE: ${{ env.REGISTRY }}/openpra-apps-site:${{ steps.vars.outputs.short_sha }}
          SITE_HOST_URL: ${{ steps.vars.outputs.site_host_url }}
        run: |
          docker stack deploy \
            --with-registry-auth \
            --resolve-image never \
            --compose-file deploy/site/cd-stack.yml \
            openpra-site
          echo "Deployed openpra-site to https://${SITE_HOST_URL}"

      - name: Roll base-image services onto the loaded images
        run: |
          SLUG="${{ steps.vars.outputs.branch_slug }}"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_mongodb"
          docker service update --force --no-resolve-image "openpra-apps-${SLUG}_minio"

      - name: Check deployment status
        run: |
          sleep 30
          docker service ls --filter "label=com.docker.stack.namespace=openpra-apps-${{ steps.vars.outputs.branch_slug }}"
          docker service ls --filter "label=com.docker.stack.namespace=openpra-site"
