name: "CI: Apps — Build, Test, Lint & Type-Check"

on:
  push:
    branches:
      - "**"
      - "!gh-readonly-queue/**"
  pull_request:
    branches:
      - "**"
  merge_group:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit
