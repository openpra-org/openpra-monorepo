name: "CI: Apps — Build, Test, Lint & Type-Check"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  nx-apps:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-nx-apps-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      NX_NO_CLOUD: "true"
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"

      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install dependencies
        run: npx -y pnpm@10.19.0 install --ignore-scripts --no-frozen-lockfile

      - name: Build
        run: npx -y pnpm@10.19.0 nx run-many -t build --projects=backends-web-backend,frontends-web-frontend,praetor

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && echo "MongoDB ready" && break
            sleep 2
          done

      - name: Test
        env:
          MONGO_URI: mongodb://localhost:27017/test
        run: |
          npx -y pnpm@10.19.0 nx run-many -t test --projects=backends-web-backend,frontends-web-frontend -- --testTimeout=60000
          npx -y pnpm@10.19.0 nx run praetor:test

      - name: Lint
        run: npx -y pnpm@10.19.0 nx run-many -t lint --projects=backends-web-backend,frontends-web-frontend,interfaces-mef-types,interfaces-shared-types

      - name: Type-check
        run: npx -y pnpm@10.19.0 nx run-many -t typecheck --projects=backends-web-backend,frontends-web-frontend,praetor,interfaces-mef-types,interfaces-shared-types

  rust-praxis:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-rust-praxis-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/solvers/praxis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Type-check
        run: cargo check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
