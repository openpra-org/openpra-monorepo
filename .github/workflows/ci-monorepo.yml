name: "CI: Monorepo — Build & Test"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        package:
          - backends-web-backend
          - frontends-web-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"

      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install dependencies
        run: npx -y pnpm@10.19.0 install --ignore-scripts --no-frozen-lockfile

      - name: Build
        env:
          NX_NO_CLOUD: "true"
        run: npx -y pnpm@10.19.0 nx build ${{ matrix.package }} --configuration=production

      - name: Wait for MongoDB
        if: matrix.package == 'backends-web-backend'
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && echo "MongoDB ready" && break
            sleep 2
          done

      - name: Test
        env:
          MONGO_URI: mongodb://localhost:27017/test
          NX_NO_CLOUD: "true"
        run: npx -y pnpm@10.19.0 nx run ${{ matrix.package }}:test -- --testTimeout=60000
