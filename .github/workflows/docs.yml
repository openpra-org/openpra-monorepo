name: "Docs: Unified TypeScript + C++"

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/docs-md/**"
      - "packages/mef-types/**"
      - "packages/shared-sdk/**"
      - "packages/frontend/web-editor/src/utils/**"
      - "packages/engine/scram/**"
      - "apps/interfaces/shared-types/**"
      - "apps/backends/web-backend/**"
      - "apps/frontends/web-frontend/**"
      - "apps/microservices/praetor/**"
      - "apps/solvers/praxis/**"
      - "apps/utilities/pracciolini/**"
      - ".github/workflows/docs.yml"
      - "docker/docs-stack.yml"
      - "docker/docs-branch-stack.yml"
      - "packages/docs-md/Dockerfile"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      sanitized_branch: ${{ steps.vars.outputs.sanitized_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install root dependencies (skip lifecycle scripts)
        run: npx -y pnpm@10.19.0 install --no-frozen-lockfile --ignore-scripts

      - name: Install Doxygen
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y doxygen graphviz

      - name: Install Doxybook2
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          curl -sSL -o doxybook2.zip https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          sudo unzip -o doxybook2.zip -d /usr/local
          sudo chmod +x /usr/local/bin/doxybook2 || true
          doxybook2 --version

      - name: Install Rust nightly and cargo-docs-md
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --no-self-update
          cargo install cargo-docs-md --version 0.2.4

      - name: Install Python doc tools
        run: |
          sudo apt-get install -y python3-pip
          python3 -m pip install lazydocs==0.4.8 lxml plotly

      - name: Generate Rust API docs (PRAXIS — cargo-docs-md)
        run: |
          mkdir -p packages/docs-md/api/rust/praxis
          cd apps/solvers/praxis
          RUSTDOCFLAGS='-Z unstable-options --output-format json' cargo +nightly doc --no-deps 2>&1 || echo "cargo doc encountered warnings"
          cargo docs-md --dir target/doc/ -o ../../../packages/docs-md/api/rust/praxis/

      - name: Generate Python API docs (pracciolini — lazydocs)
        run: |
          mkdir -p packages/docs-md/api/python/pracciolini
          if (cd apps/utilities/pracciolini/src && \
            PYTHONPATH=. python3 -m lazydocs._cli --output-path ../../../../packages/docs-md/api/python/pracciolini \
              --no-watermark --overview-file index.md \
              convert ftap ftap_verifier jsinp jsinp_verifier model \
              openpsa_verifier openpsa_xml parse_ftrex_log parse_praxis_log \
              parse_saphsolve_log parse_scram_log parse_xfta_log parse_zebra_log \
              plot_benchmark_results s2ml s2ml_verifier 2>&1); then
            node packages/docs-md/tools/sanitize-lazydocs-html.mjs packages/docs-md/api/python/pracciolini
            rm -f packages/docs-md/api/python/pracciolini/.pages
          else
            echo "Pracciolini lazydocs failed — committed baseline will be used"
          fi

      - name: Build unified Markdown docs (VitePress)
        env:
          NX_NO_CLOUD: "true"
          VITEPRESS_BASE: "/"
        run: npx -y pnpm@10.19.0 nx run docs-md:site:build --no-cloud

      - name: Link check
        env:
          VITEPRESS_BASE: "/"
        run: npx -y pnpm@10.19.0 nx run docs-md:site:link-check --no-cloud

      - name: Determine image tag
        id: vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT
          fi

          echo "sanitized_branch=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/docs-md/Dockerfile
          push: false
          load: true
          tags: |
            registry.openpra.org/openpra-docs:${{ steps.vars.outputs.image_tag }}
            registry.openpra.org/openpra-docs:${{ github.sha }}

      - name: Save Docker image as artifact
        run: |
          docker save \
            registry.openpra.org/openpra-docs:${{ steps.vars.outputs.image_tag }} \
            registry.openpra.org/openpra-docs:${{ github.sha }} \
            | gzip > docs-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-image
          path: docs-image.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: gaia1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-image

      - name: Load Docker image
        run: docker load < docs-image.tar.gz

      - name: Login to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: registry.openpra.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push to registry
        run: |
          docker push registry.openpra.org/openpra-docs:${{ needs.build.outputs.image_tag }}
          docker push registry.openpra.org/openpra-docs:${{ github.sha }}

      - name: Deploy to Docker Swarm
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          SANITIZED_BRANCH="${{ needs.build.outputs.sanitized_branch }}"

          export IMAGE_DOCS="registry.openpra.org/openpra-docs:${{ github.sha }}"

          if [ "$BRANCH_NAME" = "main" ]; then
            export DOMAIN="docs-dev.openpra.org"
            export BRANCH_SLUG="main"
            docker stack deploy \
              --with-registry-auth \
              --resolve-image never \
              --compose-file docker/docs-stack.yml \
              docs-main
            echo "Documentation deployed to https://docs-dev.openpra.org"
          else
            export APP_NAME="openpra-docs-${SANITIZED_BRANCH}"
            export HOST_URL="${SANITIZED_BRANCH}-docs-dev.openpra.org"
            docker stack deploy \
              --with-registry-auth \
              --resolve-image never \
              --compose-file docker/docs-branch-stack.yml \
              "${APP_NAME}"
            echo "Documentation deployed to https://${HOST_URL}"
          fi
