name: "Docs: Unified TypeScript + C++"

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/docs-md/**"
      - "packages/mef-types/**"
      - "packages/shared-sdk/**"
      - "packages/frontend/web-editor/src/utils/**"
      - "packages/engine/scram/**"
      - "apps/interfaces/shared-types/**"
      - "apps/backends/web-backend/**"
      - "apps/frontends/web-frontend/**"
      - "apps/microservices/praetor/**"
      - "apps/solvers/praxis/**"
      - "apps/utilities/pracciolini/**"
      - ".github/workflows/docs.yml"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: true
    runs-on: gaia1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Removed pnpm cache here because it requires pnpm to be on PATH during this step
      - name: Ensure pnpm available
        run: npx -y pnpm@10.19.0 --version

      - name: Install root dependencies (skip lifecycle scripts)
        run: npx -y pnpm@10.19.0 install --no-frozen-lockfile --ignore-scripts

      - name: Install Doxygen
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y doxygen graphviz

      - name: Install Doxybook2
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip
          curl -sSL -o doxybook2.zip https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          # Unpack into /usr/local so the binary lands in /usr/local/bin
          sudo unzip -o doxybook2.zip -d /usr/local
          sudo chmod +x /usr/local/bin/doxybook2 || true
          doxybook2 --version

      - name: Install Rust nightly and cargo-docs-md
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --no-self-update
          cargo install cargo-docs-md --version 0.2.4

      - name: Install Python doc tools
        run: python3 -m pip install lazydocs==0.4.8

      - name: Generate Rust API docs (PRAXIS — cargo-docs-md)
        run: |
          mkdir -p packages/docs-md/api/rust/praxis
          cd apps/solvers/praxis
          RUSTDOCFLAGS='-Z unstable-options --output-format json' cargo +nightly doc --no-deps 2>&1 || echo "cargo doc encountered warnings"
          cargo docs-md --dir target/doc/ -o ../../../packages/docs-md/api/rust/praxis/

      - name: Generate Python API docs (pracciolini — lazydocs)
        run: |
          mkdir -p packages/docs-md/api/python/pracciolini
          (cd apps/utilities/pracciolini/src && \
            PYTHONPATH=. python3 -m lazydocs --output-path ../../../../packages/docs-md/api/python/pracciolini \
              --no-watermark \
              convert ftap ftap_verifier jsinp jsinp_verifier model \
              openpsa_verifier openpsa_xml parse_ftrex_log parse_praxis_log \
              parse_saphsolve_log parse_scram_log parse_xfta_log parse_zebra_log \
              plot_benchmark_results s2ml s2ml_verifier 2>&1) \
          || echo "Pracciolini lazydocs failed — committed baseline will be used"

      - name: Build unified Markdown docs (VitePress)
        # Nx Cloud temporarily disabled — retain config here for quick re-enable
        env:
          NX_NO_CLOUD: "true"
          VITEPRESS_BASE: "/${{ github.event.repository.name }}/"
          # NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          # NX_BRANCH: ${{ github.ref_name }}
          # NX_RUN_GROUP: docs-${{ github.run_id }}
        run: npx -y pnpm@10.19.0 nx run docs-md:site:build --no-cloud

      - name: Link check
        env:
          VITEPRESS_BASE: "/${{ github.event.repository.name }}/"
        run: npx -y pnpm@10.19.0 nx run docs-md:site:link-check --no-cloud

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT
          fi

          echo "sanitized_branch=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT

      - name: Login to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: registry.openpra.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/docs-md/Dockerfile
          push: true
          tags: |
            registry.openpra.org/openpra-docs:${{ steps.vars.outputs.image_tag }}
            registry.openpra.org/openpra-docs:${{ github.sha }}
          build-args: |
            VITEPRESS_BASE=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Docker Swarm
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          SANITIZED_BRANCH="${{ steps.vars.outputs.sanitized_branch }}"

          export IMAGE_DOCS="registry.openpra.org/openpra-docs:${IMAGE_TAG}"

          if [ "$BRANCH_NAME" = "main" ]; then
            export DOMAIN="docs-dev.openpra.org"
            export BRANCH_SLUG="main"
            docker stack deploy \
              --with-registry-auth \
              --compose-file docker/docs-stack.yml \
              docs-main
            echo "Documentation deployed to https://docs-dev.openpra.org"
          else
            export APP_NAME="openpra-apps-${SANITIZED_BRANCH}"
            export HOST_URL="${SANITIZED_BRANCH}-dev.openpra.org"
            docker stack deploy \
              --with-registry-auth \
              --compose-file docker/docs-branch-stack.yml \
              "${APP_NAME}"
            echo "Documentation deployed to https://${HOST_URL}/documentation"
          fi
