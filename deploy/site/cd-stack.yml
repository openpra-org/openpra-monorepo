version: "3.8"

networks:
  traefik-public:
    external: true

services:
  site:
    image: ${IMAGE_SITE?Variable not set}
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: continue
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.openpra-site-http.rule=Host(`${SITE_HOST_URL?Variable not set}`)"
        - "traefik.http.routers.openpra-site-http.entrypoints=http"
        - "traefik.http.routers.openpra-site-http.middlewares=openpra-site-https-redirect,openpra-site-gzip"
        - "traefik.http.routers.openpra-site-http.service=openpra-site"
        - "traefik.http.routers.openpra-site-https.rule=Host(`${SITE_HOST_URL?Variable not set}`)"
        - "traefik.http.routers.openpra-site-https.entrypoints=https"
        - "traefik.http.routers.openpra-site-https.tls.certresolver=cloudflare"
        - "traefik.http.routers.openpra-site-https.middlewares=openpra-site-gzip"
        - "traefik.http.routers.openpra-site-https.service=openpra-site"
        - "traefik.http.services.openpra-site.loadbalancer.server.port=80"
        - "traefik.http.middlewares.openpra-site-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.openpra-site-gzip.compress=true"
