version: "3.8"

networks:
  traefik-public:
    external: true

services:
  site:
    image: ${IMAGE_SITE?Variable not set}
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: continue
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.${APP_NAME?Variable not set}-http.rule=Host(`${SITE_HOST_URL?Variable not set}`)"
        - "traefik.http.routers.${APP_NAME?Variable not set}-http.entrypoints=http"
        - "traefik.http.routers.${APP_NAME?Variable not set}-http.middlewares=${APP_NAME?Variable not set}-https-redirect,${APP_NAME?Variable not set}-gzip"
        - "traefik.http.routers.${APP_NAME?Variable not set}-http.service=${APP_NAME?Variable not set}"
        - "traefik.http.routers.${APP_NAME?Variable not set}-https.rule=Host(`${SITE_HOST_URL?Variable not set}`)"
        - "traefik.http.routers.${APP_NAME?Variable not set}-https.entrypoints=https"
        - "traefik.http.routers.${APP_NAME?Variable not set}-https.tls.certresolver=cloudflare"
        - "traefik.http.routers.${APP_NAME?Variable not set}-https.middlewares=${APP_NAME?Variable not set}-gzip"
        - "traefik.http.routers.${APP_NAME?Variable not set}-https.service=${APP_NAME?Variable not set}"
        - "traefik.http.services.${APP_NAME?Variable not set}.loadbalancer.server.port=80"
        - "traefik.http.middlewares.${APP_NAME?Variable not set}-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.${APP_NAME?Variable not set}-gzip.compress=true"
