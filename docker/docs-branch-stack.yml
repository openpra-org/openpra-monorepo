version: "3.8"

networks:
  traefik-public:
    external: true

services:
  docs:
    image: ${IMAGE_DOCS}
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: continue
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.${APP_NAME}-docs-http.rule=Host(`${HOST_URL}`)"
        - "traefik.http.routers.${APP_NAME}-docs-http.entrypoints=http"
        - "traefik.http.routers.${APP_NAME}-docs-http.middlewares=${APP_NAME}-https-redirect,gzip"
        - "traefik.http.routers.${APP_NAME}-docs-http.service=${APP_NAME}-docs"
        - "traefik.http.routers.${APP_NAME}-docs-https.rule=Host(`${HOST_URL}`)"
        - "traefik.http.routers.${APP_NAME}-docs-https.entrypoints=https"
        - "traefik.http.routers.${APP_NAME}-docs-https.tls.certresolver=cloudflare"
        - "traefik.http.routers.${APP_NAME}-docs-https.middlewares=gzip"
        - "traefik.http.routers.${APP_NAME}-docs-https.service=${APP_NAME}-docs"
        - "traefik.http.services.${APP_NAME}-docs.loadbalancer.server.port=80"
        - "traefik.http.middlewares.${APP_NAME}-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.gzip.compress=true"
